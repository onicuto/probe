<div class="block planning">
  <div class="planning__title">Планирование</div>
  <table class="planning__table">
    <tr>
      <th class="planning__table-title">Категория</th>
      <th class="planning__table-title">Лимит</th>
    </tr>
    <tr>
      <td>Транспорт</td>
      <td>2000 ₽</td>
    </tr>
    <tr>
      <td>Оплата услуг хостинга</td>
      <td>200 ₽</td>
    </tr>
    <tr>
      <td>Развлечения</td>
      <td>1000 ₽</td>
    </tr>
    <tr>
      <td>Продукты</td>
      <td>1000 ₽</td>
    </tr>
  </table>
  <div class="planning__edit">
    <div class="planning__edit-title">Изменение категорий</div>
    <form>
      <label for="name">Название</label>
      <input type="text">
      <label for="limit">Лимит</label>
      <input type="number">
      <button type="submit">Добавить</button>
    </form>
  </div>
</div>
